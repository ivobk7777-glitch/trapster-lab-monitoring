# Loki single-node config for the honeypot lab (log-server01, 192.168.20.20).
# Stores everything on the local disk under /var/lib/loki. Keeps 90 days.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # gRPC is only used inside this single process.
  grpc_listen_address: 127.0.0.1
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Trapster's log on VM 102 goes back to 5 Nov 2026; accept old entries when it is first shipped.
  reject_old_samples: true
  reject_old_samples_max_age: 2160h
  retention_period: 2160h

ingester:
  # Honeypot volume is tiny: flush idle streams early so backfilled history is queryable soon.
  chunk_idle_period: 5m

storage_config:
  tsdb_shipper:
    # How often the querier picks up newly flushed index files (default 5m).
    resync_interval: 1m

compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ruler:
  alertmanager_url: http://localhost:9093
